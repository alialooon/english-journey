name: English Journey browser smoke tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test real course flows in a local browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/english-journey-browser-server.log 2>&1 &
          sleep 3
          node tests/curriculum-audit.mjs
          node tests/pedagogical-contract.mjs
          node tests/browser-smoke.mjs
